version: '3.8'

services:
  # 1. MariaDB Database
  db:
    image: mariadb:10.11
    container_name: mini_erp_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: mini_erp
      MYSQL_USER: erpuser
      MYSQL_PASSWORD: erppassword123
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword123"]
      timeout: 5s
      retries: 10

  # 2. PHP MVC Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mini_erp_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: mini_erp
      DB_USERNAME: erpuser
      DB_PASSWORD: erppassword123
      JWT_SECRET: super_secret_production_jwt_key_2026_antigravity
      RUN_MIGRATIONS: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8000:80"

  # 3. Angular Frontend (Production Nginx Build)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "4200:80"

volumes:
  mariadb_data:
