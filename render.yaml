services:
  # PHP 8.3 Backend Web Service (100% Free on Render)
  - type: web
    name: mini-erp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      # Connect to your free MySQL database (e.g. from TiDB Cloud or Aiven)
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        value: "mini_erp"
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
