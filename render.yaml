services:
  # 1. PHP Backend API
  - type: web
    name: mini-erp-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: mini-erp-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: mini-erp-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: mini-erp-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: mini-erp-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: mini-erp-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        value: "*"

databases:
  # 2. Managed MySQL Database
  - name: mini-erp-db
    databaseName: mini_erp
    user: erpuser
    plan: free
    region: oregon
